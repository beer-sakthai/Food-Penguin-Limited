name: Python lint

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.ruff.toml'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '.ruff.toml'
      - '.github/workflows/python-lint.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: python-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install ruff
        run: python -m pip install --upgrade pip && python -m pip install ruff==0.14.5

      - name: Run ruff
        run: ruff check .
