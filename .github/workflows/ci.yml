name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, Test, Build
    uses: ./.github/workflows/_node-ci.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      job-name: Lint, Test, Build
      lint-cmd: npm run typecheck && npm run lint
      test-cmd: npm test
      build-cmd: npm run build
      attest-build: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      attest-subject-path: 'dist/**/*'
      timeout-minutes: 15
    secrets:
      step-security-api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

  security-audit:
    name: Audit All Dependencies
    uses: ./.github/workflows/_node-ci.yml
    permissions:
      contents: read
    with:
      job-name: Audit All Dependencies
      audit-cmd: npm audit --audit-level=high
      timeout-minutes: 10
    secrets:
      step-security-api-key: ${{ secrets.STEP_SECURITY_API_KEY }}
